name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        # Install a lightweight subset for CI — we don't need the heavy ML
        # libraries (xgboost, torch, etc.) just to run unit tests and linting.
        # The full requirements.txt is used locally and for model training.
        run: |
          pip install ruff pytest pytest-asyncio
          pip install pandas pyarrow duckdb python-dotenv

      - name: Lint with ruff
        # pyproject.toml configures which rules ruff applies.
        # ruff exits with code 1 if it finds any violations, failing the job.
        run: ruff check src/ scripts/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          # Tests use mocks — no real API key needed in CI.
          # This satisfies os.getenv("GOOGLE_API_KEY") calls without
          # exposing a real key in the repository.
          GOOGLE_API_KEY: "test-key-ci"
